# StagePass PostgreSQL tuning for pgBackRest WAL archiving (PG17).
# Included via `include` directive injected at container start (see db-entrypoint.sh).
archive_mode = on
archive_command = 'pgbackrest --stanza=stagepass archive-push %p'
archive_timeout = 60
max_wal_senders = 5
wal_level = replica
checkpoint_timeout = 15min
